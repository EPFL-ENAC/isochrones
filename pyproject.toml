[project]
name = "isochrones"
version = "0.5.0"
description = "This package is used to calculate isochrones and identify points of interests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.1",
    "requests>=2.32.4",
]

[project.optional-dependencies]
example = [
  "matplotlib>=3.10.6",
  "numpy>=2.3.2",
  "contextily>=1.6.2",
  "python-dotenv>=1.1.1",
  "ipykernel>=7.2.0",
  "extractosm",
]

dev = [
  "pre-commit>=4.3.0",
]

[tool.setuptools]
packages = ["isochrones"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["isochrones"]
include = [
    "isochrones/data/*.pbf",
]

[tool.uv.sources]
extractosm = { git = "https://github.com/EPFL-ENAC/extractosm.git" }
